<rect x=".5" y=".5" width="1199" height="235" rx="20" stroke="#313244"/>
<rect class="orbit" x=".5" y=".5" width="1199" height="235" rx="20" stroke="#cba6f7" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="140 2693.66"/>
