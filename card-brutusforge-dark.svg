<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="236" viewBox="0 0 1200 236" fill="none" role="img" aria-labelledby="title desc">
<title id="title">BrutusForge</title>
<desc id="desc">Site, loja, painel de administração, bot de Discord e plugins para servidores de jogo, num pacote só. Cobre 5 jogos, com automações por evento, pagamentos via Stripe e Mercado Pago, ranking, sorteios e banimento centralizado.</desc>
<style>
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes pop{from{opacity:0;transform:scale(.4)}to{opacity:1;transform:none}}
@keyframes blink{0%{opacity:1}50%{opacity:0}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.45}}
.rise{animation:rise .7s cubic-bezier(.2,.8,.2,1) both}
.fade{animation:fade .5s ease-out both}
.pop{animation:pop .5s cubic-bezier(.3,1.4,.5,1) both;transform-box:fill-box;transform-origin:center}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

@keyframes orbit{from{stroke-dashoffset:0}to{stroke-dashoffset:-2833.66}}
.orbit{animation:orbit 8s linear infinite}
.orbit2{animation:orbit 8s linear -4s infinite}
@keyframes float{from{transform:translate(0,0)}to{transform:translate(-24px,-10px)}}
.drift{animation:float 9s ease-in-out infinite alternate}</style>
<defs><clipPath id="cardclip"><rect width="1200" height="236" rx="20"/></clipPath>
<linearGradient id="mono" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#cba6f7"/><stop offset="1" stop-color="#f5c2e7"/></linearGradient>
<radialGradient id="glow" cx="1" cy="0" r="1"><stop offset="0" stop-color="#cba6f7" stop-opacity="0.18"/><stop offset="1" stop-color="#cba6f7" stop-opacity="0"/></radialGradient></defs>
<rect x=".5" y=".5" width="1199" height="235" rx="20" fill="#1b1b2a"/>
